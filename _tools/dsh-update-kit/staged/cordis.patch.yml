# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max

# computer-use：Cua Driver 经 stdio MCP 接入（独立进程，崩溃不带走 host）。
# 两个包都没有 dsh.bundle.patch，插件页拒绝安装，故手工挂载这两行。
# Cua Driver 可执行文件：C:\Users\ROG\.local\bin\cua-driver\cua-driver.exe（v0.28.0）
# 回滚：删掉本块，或恢复同目录的 cordis.patch.yml.bak-before-computeruse
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-mcp
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp'
      config:
        # 2026-10-16 诊断：直连 .exe 时 DSH 侧激活失败，而 cua-driver 本机实测完全正常
        #   （57 个工具 / elevated 完整性级别 / MCP 握手成功 / 双实例可并发）。
        #   曾试过 .cmd 包装脚本，已证伪：Node/Electron 不允许直接 spawn .cmd（spawn EINVAL）。
        #   故保持直连 .exe。历史证据：2026-09-26 / 10-04 / 10-12 本命名空间工具均可用。
        command: 'C:\Users\ROG\.local\bin\cua-driver\cua-driver.exe'
        args: [ mcp ]
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: vision-router
  name: dsh-vision-router
  config:
    progressiveTools: false
    onboardingSeen: true
- id: dsh-better-input
  name: dsh-better-input
  config:
    language: ""
    maxRecordingSeconds: 120
    polishingEnabled: true
    polishProvider: deepseek-official
    polishModel: deepseek-flash
    polishReasoningEffort: ""
    polishPrompt: ""
    optimizeEnabled: true
    optimizeProvider: deepseek-official
    optimizeModel: deepseek-flash
    optimizeReasoningEffort: ""
    optimizePrompt: ""
    contextTurns: 3
    ocrProvider: ""
    ocrModel: ""

# session-search：本地手挂插件（2026-10-13），把 ctx.sessionQuery 暴露成模型工具 session_search。
# 代码：<profile>\node_modules\dsh-session-search\index.js（loader 按 "<包名>/index.js" 解析）
# 依赖：cordis.yml 里 session-query-sqlite 的 openAt 不能是 never（现为 first-search）
# 回滚：删掉本 insert 块即可（或删除该目录）；改完需重启 Desktop
- insert:
    - id: session-search
      name: 'dsh-session-search'

# ★跨会话检索索引修复（2026-10-13，用户批准）：让 session-query-sqlite 真正建索引。
# 背景：profile 的 cordis.yml 现为空壳（4 行），配置由 bundle 组合 → 必须用 patch 覆盖。
# 实测（2026-10-13 02:00）：session_search 工具已注册，但调用返回
#   SESSION_QUERY_SEARCH_DISABLED —— "configures the session-query index with openAt never"。
# 上游默认（见 cordis.yml.bak-before-session-query 第 89-93 行）为 path: ':memory:' + openAt: never。
# 本覆盖把索引落到磁盘文件、改为首次搜索时建索引（保守，避免开机即建）。
# ⚠ 这是**启动级**配置：改完必须重启 Desktop 才生效（HMR 不会热加载 cordis.yml 层）。
# 备份：cordis.patch.yml.bak-before-session-query-fix（本块之前的完整版）
# 回滚：删掉本块 → 重启 Desktop
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js dshHomePath('session-query-index.sqlite')
    openAt: first-search
