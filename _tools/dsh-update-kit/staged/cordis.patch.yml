# ══════════════════════════════════════════════════════════════════════════
# 0.2.1 兼容层（2026-10-17 加入，勿删）
#
# 背景：DSH Desktop 0.2.1-rc.2 改了 Web 运行时接口 ——
#   ① `connection` 行的依赖从 inject: [webRuntime] 改为 inject: [webStartup]；
#   ② web-app 提供的服务从 `webRuntime` 改名为 `webApp`（web-runtime 行的 id 未变）。
# 但 @hr98w/dsh-memory@0.1.4 与 dsh-vision-router@3.0.3 的 bundle patch 仍写死
#   inject: [webRuntime, webServer]
# 它们属于 bundle 层、先于本文件应用，于是把 0.2.1 的官方依赖覆盖回去；
# `connection` 永远等不到已不存在的 webRuntime，启动审计报
#   「startup failed: 1 required plugin did not activate / connection → webRuntime」。
# 这正是 2026-10-17 更新后启动崩溃、点「禁用第三方插件」才恢复的原因。
#
# 修法：在本 profile 层（最后应用）把这一行压回 0.2.1 官方值。幂等、无害；
# 官方升级或插件作者修复后仍可保留。证据见
#   resources/app.asar/dsh/node_modules/@deepseek-ai/dsh-web-app/cordis.patch.yml
#   （0.2.1：- id: connection → inject: [webStartup]）
#
# 回滚：删掉本块即可（但下次启动会再崩，除非那两个插件已修复）。
# ══════════════════════════════════════════════════════════════════════════
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webStartup]
